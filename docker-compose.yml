services:

  postgres:

    image: postgres:16

    container_name: postgres-template

    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: template_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_template_data:/var/lib/postgresql/data


volumes:
  postgres_template_data: